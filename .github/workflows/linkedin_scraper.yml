name: LinkedIn Data Engineer Job Scraper

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron:  '*/5 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Grants permission to commit changes back to repo

jobs:
  scrape-and-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Job Scraper
        run: python scraper.py

      - name: Commit and push updated jobs.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add jobs.json
          git status
          git diff-index --quiet HEAD || (git commit -m "chore: update LinkedIn Data Engineer jobs log" && git push)
